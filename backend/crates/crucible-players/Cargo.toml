[package]
name = "crucible-players"
description = "Player sessions, entity control, reconnection, and profiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crucible-ecs = { workspace = true }
# Bundled SQLite (rusqlite and libsqlite3-sys are MIT, SQLite itself is public domain).
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
